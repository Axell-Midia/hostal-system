spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostal_db}
    username: ${DB_USER:hostal_user}
    password: ${DB_PASSWORD:hostal_pass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:clave-secreta-desarrollo-al-menos-256-bits-de-longitud-para-hmac-sha256}
    expiration-ms: 86400000
  security:
    swagger-enabled: ${SWAGGER_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
